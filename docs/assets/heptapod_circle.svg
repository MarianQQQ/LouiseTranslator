<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="220" height="220">
  <defs>
    <radialGradient id="heptapodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C0F0" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#0078D6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#101010" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="160" fill="url(#heptapodGlow)" />

  <!-- Rotating Heptapod Logogram Ring -->
  <g filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="45s" repeatCount="indefinite" />
    
    <!-- Main broken ink ring -->
    <path d="M 200,45 
             C 275,43 345,105 354,180 
             C 362,250 310,330 235,352 
             C 160,370 75,315 50,240 
             C 30,175 75,85 155,52 
             C 170,46 185,45 200,45 Z" 
          fill="none" stroke="#f1ffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 8 26 12 40 18 10 24 55 16">
      <animate attributeName="stroke-opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite" />
    </path>

    <!-- Outer organic ink tendrils -->
    <path d="M 200,38 C 240,32 300,60 340,110 C 375,155 365,220 345,280 C 320,335 260,368 200,362" 
          fill="none" stroke="#00C0F0" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 16 30 10 12 22" opacity="0.85">
      <animate attributeName="stroke-width" values="2.5;4;2.5" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Outer splatter dots -->
    <circle cx="345" cy="130" r="3.5" fill="#00C0F0" opacity="0.8" />
    <circle cx="360" cy="155" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="325" cy="310" r="4" fill="#00C0F0" opacity="0.7" />
    <circle cx="210" cy="368" r="2.5" fill="#ffffff" opacity="0.85" />
    <circle cx="65" cy="270" r="3" fill="#00C0F0" opacity="0.75" />
    <circle cx="42" cy="200" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="85" cy="95" r="3.5" fill="#00C0F0" opacity="0.8" />
    <circle cx="160" cy="38" r="2" fill="#ffffff" opacity="0.9" />

    <!-- Inner organic tendrils -->
    <path d="M 200,62 C 260,65 315,115 320,180 C 325,240 280,305 220,325 C 160,340 95,295 80,230 C 68,175 105,100 170,70" 
          fill="none" stroke="#f1ffff" stroke-width="4" stroke-dasharray="20 14 35 18 12 10" opacity="0.9" />

    <!-- Inner ink spikes -->
    <path d="M 330,170 Q 305,185 295,190" stroke="#00C0F0" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 230,335 Q 215,310 205,300" stroke="#f1ffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M 90,210 Q 115,200 130,205" stroke="#00C0F0" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <path d="M 160,75 Q 180,95 190,110" stroke="#f1ffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Counter-rotating floating mist particles in core -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="25s" repeatCount="indefinite" />
    <circle cx="185" cy="180" r="2.5" fill="#00E5FF" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="215" cy="195" r="1.5" fill="#ffffff" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="195" cy="220" r="2" fill="#00C0F0" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
