<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="20">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C0F0" stop-opacity="0" />
      <stop offset="30%" stop-color="#00C0F0" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1">
        <animate attributeName="stop-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#00C0F0" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00C0F0" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="50" y1="10" x2="850" y2="10" stroke="url(#grad)" stroke-width="1.5" filter="url(#glow)" stroke-linecap="round"/>
  <circle cx="450" cy="10" r="3" fill="#00C0F0" filter="url(#glow)">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="420" cy="10" r="1.5" fill="#f1ffff" opacity="0.6" />
  <circle cx="480" cy="10" r="1.5" fill="#f1ffff" opacity="0.6" />
</svg>
