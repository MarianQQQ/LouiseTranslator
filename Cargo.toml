[package]
name = "louisetranslator"
version = "0.1.0"
edition = "2024"
description = "Louise — discreet, keyboard-first instant translator for Windows inspired by Dr. Louise Banks (Arrival)"

[[bin]]
name = "LouiseTranslator"
path = "src/main.rs"

[dependencies]
arboard = "3.6.1"
global-hotkey = "0.8.0"
raw-window-handle = "0.6"
reqwest = { version = "0.13.5", features = ["json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
base64 = "0.23"
tokio = { version = "1.53.1", features = ["full"] }
tray-icon = "0.25.1"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_LibraryLoader"] }

[build-dependencies]
slint = "1.18.1"
slint-build = "1.18.1"
winres = "0.1.12"
